<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Dish Aligner</title>

  <!-- Background: Home Assistant blue, flat -->
  <rect width="512" height="512" rx="112" fill="#03a9f4"/>

  <!-- Mount: pole + base plate (drawn first so the dish overlaps the pole top) -->
  <rect x="157" y="310" width="24" height="114" fill="#b3e5fc"/>
  <rect x="92" y="418" width="154" height="26" rx="13" fill="#b3e5fc"/>

  <!-- Dish assembly, axis tilted toward upper-right -->
  <g transform="translate(225 258) rotate(38) scale(0.95)">
    <!-- feed arm -->
    <rect x="-6" y="-146" width="12" height="150" rx="6" fill="#ffffff"/>
    <!-- bowl (back of the dish) -->
    <path d="M-150 0 A150 96 0 0 0 150 0 Z" fill="#81d4fa"/>
    <!-- bowl highlight (flat second tone on the back) -->
    <path d="M-108 0 A129 80 0 0 0 150 0 Z" fill="#ffffff"/>
    <!-- dish face -->
    <ellipse cx="0" cy="0" rx="150" ry="50" fill="#b3e5fc" stroke="#ffffff" stroke-width="12"/>
    <ellipse cx="0" cy="6" rx="72" ry="22" fill="#4fc3f7"/>
    <!-- feed arm in front of the face -->
    <rect x="-6" y="-146" width="12" height="130" rx="6" fill="#ffffff"/>
    <!-- feed horn -->
    <circle cx="0" cy="-152" r="19" fill="#ffc107"/>
    <!-- signal arcs -->
    <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round">
      <path d="M-25.7 -182.6 A40 40 0 0 1 25.7 -182.6"/>
      <path d="M-42.4 -202.6 A66 66 0 0 1 42.4 -202.6"/>
      <path d="M-59.1 -222.5 A92 92 0 0 1 59.1 -222.5"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
